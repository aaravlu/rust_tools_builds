name: Build Rust Tools

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        tool: [cargo-cache, cargo-clippy, cargo-nextest, rustfmt]
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.tool }} on ${{ matrix.os }}

    steps:
      - name: Windows config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022' && matrix.tool != 'cargo-clippy'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Checkout self
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.tool }}
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON('{"cargo-cache":"matthiaskrgr/cargo-cache","cargo-clippy":"rust-lang/rust-clippy","cargo-nextest":"nextest-rs/nextest","rustfmt":"rust-lang/rustfmt"}')[matrix.tool] }}
          ref: ${{ fromJSON('{"cargo-cache":"refs/tags/0.8.3","cargo-clippy":"refs/tags/rust-1.91.0","cargo-nextest":"refs/tags/cargo-nextest-0.9.114","rustfmt":"refs/tags/v1.8.0"}')[matrix.tool] }}
          path: tool-source

      - name: Copy cargo config
        shell: bash
        run: |
          mkdir -p tool-source/.cargo
          cp .cargo/config.toml tool-source/.cargo/

      - name: Handle panic
        if: matrix.tool == 'rustfmt' || matrix.tool == 'cargo-clippy'
        shell: bash
        run: |
          rm tool-source/.cargo/config.toml
          cp .cargo/config_2.toml tool-source/.cargo/config.toml

      - name: Build tool
        shell: bash
        run: |
          cd tool-source
          cargo b -r

      - name: Package artifact
        run: |
          # 确定可执行文件名称
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            EXE_NAME="${{ matrix.tool }}.exe"
            EXE_PATTERN="*.exe"
          else
            EXE_NAME="${{ matrix.tool }}"
            EXE_PATTERN="${{ matrix.tool }}"
          fi

          # 在多个可能的位置查找可执行文件
          POSSIBLE_PATHS=(
            "tool-source/target/release/$EXE_NAME"
            "tool-source/target/release/deps/$EXE_NAME"
            "tool-source/target/x86_64-pc-windows-msvc/release/$EXE_NAME"
            "tool-source/target/x86_64-unknown-linux-gnu/release/$EXE_NAME"
            "tool-source/target/release/*"
            "tool-source/target/*/release/$EXE_NAME"
          )

          # 创建artifacts目录
          mkdir -p artifacts

          # 尝试从已知路径复制
          FOUND=false
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -f "$path" ]; then
              echo "Found executable at: $path"
              cp "$path" artifacts/
              FOUND=true
              break
            fi
          done

          # 如果没找到，尝试使用find命令
          if [ "$FOUND" = false ]; then
            echo "Searching for executable with pattern: $EXE_PATTERN"
            find tool-source/target -name "$EXE_PATTERN" -type f | head -1 | xargs -I {} cp {} artifacts/ 2>/dev/null || true
          fi

          # 检查是否成功复制了文件
          if [ -z "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "WARNING: No executable found for ${{ matrix.tool }}"
            # 创建空文件作为标记
            touch artifacts/empty.txt
          else
            echo "Successfully packaged artifact"
            ls -la artifacts/
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.tool }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  collect-artifacts:
    name: Collect All Artifacts
    runs-on: ubuntu-24.04
    needs: build
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts structure:"
          find all-artifacts -type f | sort
          echo ""
          echo "Total files:"
          find all-artifacts -type f | wc -l
